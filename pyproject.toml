[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognator"
version = "0.1.0"
description = "Framework-native cognate detection"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Tiago Tresoldi"}
]
classifiers = [
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/tresoldi/cognator"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
