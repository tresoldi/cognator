[build-system]
# setuptools>=77 and packaging>=24.2 because `license` below is a PEP 639 SPDX
# expression and `license-files` goes with it; older setuptools does not
# understand either, and setuptools 77 without a matching packaging raises
# ImportError on packaging.licenses while reading this file. The floor was
# 68, which is why an install against a runner's older toolchain failed with a
# traceback out of setuptools' own normalizer rather than anything about
# cognator.
requires = ["setuptools>=77.0.0", "packaging>=24.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognator"
version = "0.1.0"
description = "Framework-native cognate detection"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "third_party/merkmal/LICENSE"]
authors = [
  {name = "Tiago Tresoldi"}
]
classifiers = [
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "mypy", "build"]

[project.urls]
Homepage = "https://cognator.tresoldi.org/"
Documentation = "https://github.com/tresoldi/cognator#readme"
Repository = "https://github.com/tresoldi/cognator"
"Bug Tracker" = "https://github.com/tresoldi/cognator/issues"

[project.scripts]
cognator = "cognator.cli:main"
cognator-py = "cognator.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
cognator = ["py.typed", "*.pyi"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
test-command = "python -c \"import cognator; assert cognator.abi_version() == 1\""

[tool.ruff]
# Pinned deliberately. Without a select list the rule set is whatever the
# installed ruff happens to default to, so a ruff release breaks the build on a
# day nobody touched the code -- which is exactly what happened here between
# 0.15 and 0.16, going from zero findings to eighty-eight. The families are
# merkmal's and regulae's, minus nothing; target-version is this package's own
# floor rather than theirs.
target-version = "py39"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TC"]

[tool.ruff.lint.per-file-ignores]
# The benchmark and report scripts are held to the same rules as the library
# except line length: they are full of long literal column names and command
# lines that read worse wrapped.
"scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
