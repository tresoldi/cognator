[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognator"
version = "0.1.0"
description = "Framework-native cognate detection"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "third_party/merkmal/LICENSE"]
authors = [
  {name = "Tiago Tresoldi"}
]
classifiers = [
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "mypy", "build"]

[project.urls]
Homepage = "https://cognator.tresoldi.org/"
Documentation = "https://github.com/tresoldi/cognator#readme"
Repository = "https://github.com/tresoldi/cognator"
"Bug Tracker" = "https://github.com/tresoldi/cognator/issues"

[project.scripts]
cognator = "cognator.cli:main"
cognator-py = "cognator.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
cognator = ["py.typed", "*.pyi"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
test-command = "python -c \"import cognator; assert cognator.abi_version() == 1\""

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
